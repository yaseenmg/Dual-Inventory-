name: Build mod

on:
  push:
    paths:
      - "src/**"
      - "gradle/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "dualinv/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "gradle/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "dualinv/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Generate missing Gradle Wrapper and commit it
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.8 --distribution-type bin
            if [ "$EVENT_NAME" != "pull_request" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
              git commit -m "Add Gradle wrapper JAR [skip wrapper]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: Build Forge mod
        run: ./gradlew build --no-daemon
      - name: Package source archive
        run: |
          zip -r dualinventory-source.zip README.md LICENSE .gitignore SETUP_WRAPPER.md SOURCE_STATUS.md build.gradle gradle.properties settings.gradle gradlew gradlew.bat gradle src
      - name: Upload mod JAR and source archive
        uses: actions/upload-artifact@v4
        with:
          name: Dual-Inventory-Forge-1.20.1
          path: |
            build/libs/*.jar
            dualinventory-source.zip
          if-no-files-found: error
          retention-days: 90
